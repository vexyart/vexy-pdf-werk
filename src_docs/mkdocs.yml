# this_file: src_docs/mkdocs.yml
site_name: PDF Werk
site_description: Convert PDF files into an optimised or OCR'd PDF/A, paginated Markdown, ePub and YAML metadata.
site_url: https://vexy.dev/vexy-pdf-werk/
repo_url: https://github.com/vexyart/vexy-pdf-werk
repo_name: GitHub repository
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: fly-january
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}
extra:
  fly:
    chrome: none
    hue: indigo
    links: accent
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - meta
  - tags
  - awesome-nav
  - search
  - fly
